name: Ofertas y clausulazos

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 minutos (GitHub puede retrasarlo unos minutos)

concurrency:
  group: market           # el mismo grupo que «Cerrar mercados»: nunca a la vez
  cancel-in-progress: false

jobs:
  deals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm ci --prefix scripts
      - name: Ejecutar ofertas y clausulazos
        run: node scripts/deals.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
