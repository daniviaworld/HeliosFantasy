/* Concepto: app móvil de una columna (480px). Cabecera azul noche fija con el saldo, contenido en listas limpias,
   navegación inferior de 5 pestañas y hojas deslizantes para pujas, jugadores y ventas. Acento solar (Helios). */
:root{
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#EDF0F6; --surface:#FFFFFF; --surface2:#E4E9F2; --fg:#0F1E3D; --muted:#58668A; --line:#D3DAE8;
  --accent:#F2A20F; --accent-ink:#1B1204; --accent-text:#8F5600;
  --hot:#D92E3A; --hot-ink:#FFFFFF; --gold:#FFD400; --gold-ink:#1B1400;
  --head:#0F1E3D; --head-fg:#F3F6FC; --head-muted:#9FB0D2;
  --good:#1B8049; --bad:#C2342A; --pitch:#2B7A4A; --pitch2:#2F8352; --scrim:rgba(6,12,28,.55);
  --p-por:#8F5600; --p-def:#2B5FC4; --p-med:#1B7A45; --p-del:#B83229;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1226; --surface:#121D38; --surface2:#1B2A52; --fg:#E9EFFB; --muted:#93A1C0; --line:#243459;
    --accent:#F5A524; --accent-ink:#1B1204; --accent-text:#F5A524; --hot:#FF5A52; --hot-ink:#1B0404; --gold:#FFD400; --gold-ink:#1B1400;
    --head:#0C1630; --head-fg:#F3F6FC; --head-muted:#8FA0C4;
    --good:#3CCB7A; --bad:#F27A70; --pitch:#1E5A3A; --pitch2:#226640; --scrim:rgba(2,5,14,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1226; --surface:#121D38; --surface2:#1B2A52; --fg:#E9EFFB; --muted:#93A1C0; --line:#243459;
  --accent:#F5A524; --accent-ink:#1B1204; --accent-text:#F5A524; --hot:#FF5A52; --hot-ink:#1B0404; --gold:#FFD400; --gold-ink:#1B1400;
  --head:#0C1630; --head-fg:#F3F6FC; --head-muted:#8FA0C4;
  --good:#3CCB7A; --bad:#F27A70; --pitch:#1E5A3A; --pitch2:#226640; --scrim:rgba(2,5,14,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font:700 24px/1.1 var(--font-display);letter-spacing:.01em}
h3{font:700 13px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.up{color:var(--good)} .down{color:var(--bad)}

/* cabecera */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-fg)}
.top::after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--hot),var(--accent),var(--gold))}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.menub{background:none;border:0;color:var(--head-fg);width:40px;height:40px;display:flex;align-items:center;justify-content:center;margin-left:-8px;flex:none}
.menub[hidden]{display:none}
.menub svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.brand .logo{width:38px;height:38px;border-radius:9px;flex:none;display:block}
.brand b{display:block;font:700 22px/1 var(--font-display);letter-spacing:.06em}
.brand small{display:block;font:600 10px/1.2 var(--font-body);letter-spacing:.14em;color:var(--head-muted);text-transform:uppercase}
.themeb{background:none;border:1px solid var(--head-muted);color:var(--head-fg);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-left:auto;flex:none;padding:0}
.themeb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bal{text-align:right}
.bal small{display:block;font:600 10px/1.2 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--head-muted)}
.bal b{font:700 20px/1.1 var(--font-display);letter-spacing:.02em}
.bal.neg b{color:#FF8E84}
.cpuoff{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.cpuoff small{display:block;color:var(--muted);font-size:12px}
.cpuoff b{font:700 18px/1.2 var(--font-display)}
.livepts{color:#2ECC71}
.jb.live b::after{content:' ●';color:#E5484D}
.bcnt{color:var(--accent,#F5B301)}
.warnb{margin-top:12px;border-left:4px solid #E5484D}
.hico{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface-2,rgba(128,128,128,.18));font-size:20px;flex:none}
.bal .balx{display:block;font:600 12px/1.25 var(--font-body);color:var(--head-muted)}
.bal .balx.pend{color:#FF8E84}
.bal .balx.neg{color:#FF8E84}

main{padding-top:16px;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
section{margin-top:22px}
section>h3{margin-bottom:10px}

/* navegación */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.nav button{background:none;border:0;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font:600 11px/1 var(--font-body);position:relative}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--hot)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--hot)}
.nav .dot{position:absolute;top:8px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:700 10px/16px var(--font-body);text-align:center;padding:0 4px}

/* bloques */
.strip{background:var(--surface2);color:var(--muted);font-size:12.5px;padding:8px 12px;border-radius:8px}
.hero{margin-top:14px;background:radial-gradient(120% 140% at 100% 0%,rgba(245,165,36,.38),transparent 55%),linear-gradient(135deg,#0F1E3D,#3A1F6E);color:var(--head-fg);border-radius:16px;padding:18px 18px 16px}
.hero .lab{font:600 11px/1 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--head-muted)}
.hero .big{font:700 46px/1 var(--font-display);letter-spacing:.02em;margin-top:8px;color:var(--accent)}
.hero .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.tag{display:inline-block;font:600 11px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.tag.ok{background:rgba(60,203,122,.18);color:var(--good)} .tag.warn{background:rgba(245,165,36,.2);color:var(--accent-text)}
.hero .tag.ok{color:#6FE3A2} .hero .tag.warn{color:var(--accent)}
.kvs{display:flex;flex-direction:column}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)} .kv b{font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.panel.pad{padding:14px}
.banner{margin-top:14px;padding:11px 14px;border-radius:10px;background:rgba(194,52,42,.12);color:var(--bad);font-weight:600;font-size:14px}

/* listas */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 0;min-height:60px}
.list>.prow:last-child,.list>.item:last-child{border-bottom:0}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.psub{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pright{text-align:right;display:flex;flex-direction:column;gap:2px;flex:none}
.pright b{font-weight:600} .pright small{font-size:12px;color:var(--muted)}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;background:hsl(var(--h) 42% 36%);color:#fff;font:700 15px/1 var(--font-display);letter-spacing:.04em}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av.lg{width:46px;height:46px;font-size:17px;border:2px solid rgba(255,255,255,.85)}
.av.xl{width:60px;height:60px;font-size:22px}
.av.plus{background:rgba(255,255,255,.14);border:2px dashed rgba(255,255,255,.55);font-size:22px}
.pos{font:700 10px/1 var(--font-body);letter-spacing:.06em;color:#fff;padding:3px 5px;border-radius:4px}
.pos.ENT{background:#5b6475} .pos.POR{background:var(--p-por)} .pos.DEF{background:var(--p-def)} .pos.MED{background:var(--p-med)} .pos.DEL{background:var(--p-del)}
.feeddate{margin:16px 2px 8px;font:700 12px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.feedc{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;margin-top:8px}
.feedc.mine{border-left-color:var(--hot)}
.feedh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.feedh b{font:700 16px/1.2 var(--font-body)}
.feedh time{font:600 13px/1 var(--font-body);color:var(--muted)}
.feedx{margin-top:5px;font-size:15px;line-height:1.4}
.item{padding:12px 0;border-bottom:1px solid var(--line)}
.item .meta{display:flex;gap:8px;align-items:center;margin-bottom:5px;font-size:12px;color:var(--muted)}
.kind{font:700 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent-text)}
.kind.k-jornada{color:var(--good)} .kind.k-msg{color:var(--muted)}

/* controles */
.btn{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;padding:0 16px}
.btn.primary{background:var(--hot);color:var(--hot-ink);border-color:transparent}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:transparent;font-weight:700}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.full{width:100%;margin-top:12px}
.btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{background:transparent;border-color:var(--head-muted);color:var(--head-fg)}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;min-height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.inp{width:100%;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:17px;margin-top:6px}
select.inp{font-size:15px}
.fl{display:block;margin-top:14px;font-weight:600;font-size:14px}
.qb{display:flex;gap:8px;margin-top:10px}
.qb .btn{flex:1;min-height:38px;padding:0}
.err{color:var(--bad);font-weight:600;margin:10px 0 0}
.sw{width:50px;height:30px;border-radius:15px;border:0;background:var(--surface2);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(20px);background:#fff}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.setrow>div{min-width:0}
.step{display:flex;align-items:center;gap:10px}
.step button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:18px;line-height:1}
.step b{min-width:22px;text-align:center}
.code{font:700 22px/1 var(--font-display);letter-spacing:.12em}

/* alineación */
.pitch{position:relative;border-radius:16px;padding:18px 6px 14px;display:flex;flex-direction:column;gap:18px;background:repeating-linear-gradient(180deg,var(--pitch) 0 56px,var(--pitch2) 56px 112px)}
.pitch::before{content:"";position:absolute;inset:8px;border:1.5px solid rgba(255,255,255,.28);border-radius:10px;pointer-events:none}
.pitch::after{content:"";position:absolute;left:8px;right:8px;top:50%;border-top:1.5px solid rgba(255,255,255,.2);pointer-events:none}
.prow2{display:flex;justify-content:space-around;position:relative;z-index:1}
.slot{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:0;width:66px;color:#fff;position:relative;padding:0}
.rvhead{margin-top:2px}.rvn{display:flex;align-items:center;gap:12px;margin-top:10px}.rvp{margin-left:auto;text-align:right;display:flex;flex-direction:column}.rvp b{font:800 26px/1 var(--font-head)}.rvp small{color:var(--muted);font-weight:700;font-size:10px;letter-spacing:.5px}
.slot .rv{position:absolute;left:0;right:0;bottom:0;background:rgba(15,30,61,.82);color:#fff;font:700 9px/1.5 var(--font-body);text-align:center;letter-spacing:.2px}
.fxfold{margin-top:14px}.fxfold summary{cursor:pointer;font:700 14px/1.2 var(--font-body);padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;list-style:none}
.fxfold summary::-webkit-details-marker{display:none}.fxfold summary::after{content:"▾";float:right}.fxfold[open] summary::after{content:"▴"}
.fxfold[open] summary{border-radius:12px 12px 0 0}.fxfold .panel{border-top:0;border-radius:0 0 12px 12px}
.slot .sn{font:700 12px/1.2 var(--font-body);background:#fff;color:#0F1E3D;width:62px;text-align:center;padding:3px 2px;border-radius:0 0 6px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .pt{position:absolute;top:3px;left:3px;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:700 11px/20px var(--font-body);text-align:center;padding:0 4px}
.tile{position:relative;display:block;width:62px}
.formrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.pts-sum{font:700 28px/1 var(--font-display);letter-spacing:.02em}

/* gráficos */
.spark{width:100%;height:auto;display:block}
.spark .ln{fill:none;stroke:var(--accent-text);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.spark .ar{fill:var(--accent-text);opacity:.14}
.spark .gr{stroke:var(--line);stroke-width:1}
.spark .dt{fill:var(--accent-text);stroke:var(--surface);stroke-width:2.5}
.chartnote{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:2px}
.bars{display:flex;gap:10px;align-items:flex-end;height:84px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:12px;font-weight:600}
.bars i{display:block;width:100%;border-radius:5px 5px 0 0;background:var(--accent-text);opacity:.85;min-height:3px}
.bars div:last-child i{opacity:1}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:0 18px}
.bars.j8{gap:6px}
.bars.j8 div{font-size:11.5px}
.jr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.jr:last-child{border-bottom:0}
.jn{width:30px;flex:none;font-weight:700;color:var(--muted)}
.jm{flex:1;min-width:0;font-size:14px}
.jm i{font-style:normal;font-weight:700}
.jp{min-width:38px;text-align:center;border-radius:8px;padding:5px 0;font-weight:700;background:var(--surface2)}
.jp.hi{background:rgba(30,160,90,.2);color:var(--good)}
.jp.lo{background:rgba(194,52,42,.14);color:var(--bad)}
.jr.tot{font-weight:700}

/* hojas */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:88%;overflow-y:auto;background:var(--surface);color:var(--fg);border-radius:20px 20px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet:focus{outline:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 14px}
.sheet h2{margin-bottom:6px}
.sheet .list{margin-top:12px;border:0;padding:0}
.shead{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.pos-n{width:22px;font:700 18px/1 var(--font-display);color:var(--muted);flex:none;text-align:center}
.me{background:var(--surface2);margin:0 -14px;padding-left:14px;padding-right:14px}
.msgbox{display:flex;gap:8px}
.msgbox .inp{margin-top:0;min-height:44px;font-size:15px}
.match{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.match:last-child{border-bottom:0}
.match .tm{flex:1;display:flex;align-items:center;gap:8px;font-weight:600}
.match .tm:last-child{justify-content:flex-end}
.match time{font-size:12.5px;color:var(--muted);text-align:center;min-width:76px}
.dotc{width:12px;height:12px;border-radius:50%;background:hsl(var(--h) 42% 40%)}
/* fotos y escudos de ejemplo */
.ph{position:relative;display:block;width:40px;height:48px;border-radius:8px;overflow:hidden;flex:none;background:linear-gradient(160deg,hsl(var(--h) 55% 34%),hsl(var(--h) 62% 16%))}
.ph svg{position:absolute;inset:0;width:100%;height:100%}
.ph.lg{width:62px;height:74px;border-radius:8px 8px 0 0}
.ph.xl{width:78px;height:94px;border-radius:12px}
.ph.mk{width:84px;height:100px;border-radius:12px}
.ph.empty{background:rgba(255,255,255,.12);border:2px dashed rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px}
.cr{position:absolute;top:3px;right:3px;display:flex;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}
.crest{display:block}
.pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;background:#e7ebf2}
.cw{position:relative;display:inline-block;vertical-align:middle;flex:none}
.cw img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
/* mercado */
.mcard{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:10px}
.mimg{position:relative;background:none;border:0;padding:0;flex:none;width:84px;height:100px}
.mcard .info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.mcard .l1{display:flex;align-items:center;gap:8px}
.mcard .pn{font:700 20px/1.1 var(--font-display);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .pf{text-align:right;white-space:nowrap}
.mcard .pf small{color:var(--muted);font-weight:600;letter-spacing:.06em}
.mcard .pf b{font:700 22px/1 var(--font-display)}
.mcard .vl{display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--muted)}
.mcard .vl b{color:var(--fg);font-weight:600}
.mcard .l3{display:flex;align-items:center;justify-content:space-between;gap:8px}
.reward{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px;padding:14px;border-radius:14px;background:linear-gradient(135deg,#0F1E3D,#3A1F6E);color:#fff;border:1px solid rgba(255,212,0,.4)}
.reward .rw{font:700 28px/1.1 var(--font-display);color:var(--gold);margin-top:2px}
/* equipo */
.tbar{display:flex;justify-content:space-between;gap:10px;padding:2px 0 12px}
.tbar small{display:block;font:600 10.5px/1.2 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tbar b{font:700 21px/1.2 var(--font-display);letter-spacing:.02em}
.tbar>div:last-child{text-align:right}
.utabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.utabs button{background:none;border:0;min-height:46px;font:700 16px/1 var(--font-body);color:var(--muted);border-bottom:3px solid transparent}
.utabs button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--hot)}
/* ligas */
.splash{display:flex;justify-content:center;margin:2px 0 14px}
.splash img{width:132px;height:132px;border-radius:26px;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.brand{background:none;border:0;color:inherit;padding:0;text-align:left}
.brand span{display:block;min-width:0}
.brand small{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbar{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left}
.lbar span{display:block;min-width:0}
.lbar b{font:700 20px/1.1 var(--font-display);display:block}
.lbar small{display:block;color:var(--muted);font-size:12.5px}
.lbar .lgo{color:var(--hot);font-weight:700;font-size:14px;white-space:nowrap}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.lcard.cur{border-left-color:var(--hot)}
.ltop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ltop b{font:700 22px/1.1 var(--font-display);margin-right:auto}
.lst{display:flex;gap:24px;margin-top:10px}
.lst span{display:block}
.lst b{display:block;font:700 20px/1.1 var(--font-display)}
.lst small{display:block;color:var(--muted);font-size:12px}
.codebox{text-align:center;margin-top:14px}
.codebox .code{font-size:36px;margin:6px 0}
.sw[disabled],select[disabled],.step button[disabled]{opacity:.5;cursor:default}
.slot{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.slot .tile{position:relative;display:block}
.ptc{position:absolute;top:0;left:0;width:46px;height:46px;clip-path:polygon(0 0,100% 0,0 100%);color:#fff;font:800 15px/1 var(--font-body);padding:6px 0 0 6px;box-sizing:border-box;z-index:2}
.ptc.pg{background:#1faa59}.ptc.py{background:#e0b400;color:#1b1b1b}.ptc.pr{background:#d6453d}
.ptc2{font:800 16px/1 var(--font-body)}
.jbar{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 12px;-webkit-overflow-scrolling:touch}
.jb{flex:none;width:60px;height:60px;border-radius:50%;border:0;background:var(--surface2);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.slot.ownideal .tile{outline:3px solid #F5B301;outline-offset:2px;border-radius:14px}
.jb b{font:700 12px/1 var(--font-body);opacity:.8}.jb span{font:800 17px/1 var(--font-body)}
.jb.on{background:#1faa59;color:#fff}.jb.on b{opacity:1}.jb.off{opacity:.55}
.sqc{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:10px;color:var(--fg)}
.sqw{margin-top:10px}.sqw .sqc{margin-top:0;border-bottom-left-radius:0;border-bottom-right-radius:0}
.sqact{display:flex;gap:8px;justify-content:flex-end;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px}
.tag.lock{background:rgba(242,92,84,.16);color:var(--hot)}
.mny{display:inline-flex;align-items:center;gap:7px;font:600 15px/1.2 var(--font-body);color:var(--accent-text)}
.mny b{font-weight:700;letter-spacing:.01em}
.mny .cn{width:20px;height:20px;border-radius:50%;background:var(--gold);color:var(--gold-ink);font:800 12px/20px var(--font-body);font-style:normal;text-align:center;flex:none}
.mny .ic{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.mny .ic svg{width:13px;height:13px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mny.lkg{color:var(--good)}.mny.lkg .ic{background:var(--good)}
.mny.lkr{color:var(--hot)}.mny.lkr .ic{background:var(--hot)}
.mrows{display:flex;flex-direction:column;gap:4px}
.mcard .vl{gap:4px}.mcard .vr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mcard .vlab{color:var(--muted);font-weight:600}
.mcard .mpr{color:var(--fg);font:800 18px/1.1 var(--font-body);letter-spacing:.01em}
.mcard .vl .mny{font-size:16px}.mcard .vl .mny b{color:var(--accent-text);font-weight:700}
.sqc .sm{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.sqc .nm{font:700 16px/1.2 var(--font-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sqc .sub{display:flex;align-items:center;gap:6px;font:500 13px/1.2 var(--font-body);color:var(--muted)}
.sqc .sr{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.sqc .sr small{font:700 10px/1 var(--font-body);color:var(--muted);letter-spacing:.08em}
.sqc .sr b{font:800 22px/1 var(--font-display)}
.fcs{display:flex;gap:4px}.fc{min-width:26px;height:22px;border-radius:4px;color:#fff;font:700 12px/22px var(--font-body);text-align:center;padding:0 3px}
.fc.g{background:#1faa59}.fc.y{background:#e0b400;color:#1b1b1b}.fc.r{background:#d6453d}.fc.n{background:var(--surface2);color:var(--muted)}
.slot .capb{position:absolute;left:3px;bottom:3px;width:18px;height:18px;border-radius:4px;background:#e5484d;color:#fff;font:800 11px/18px var(--font-body);text-align:center}
.slot .more{position:absolute;right:3px;bottom:3px;min-width:20px;height:18px;border-radius:9px;background:rgba(15,30,61,.85);color:#fff;font:700 11px/18px var(--font-body);text-align:center;padding:0 4px}
.slot.drag .tile{opacity:.3}
.slot.dz .tile{outline:3px solid var(--accent);outline-offset:1px;border-radius:8px}
.dragghost{position:fixed;z-index:90;pointer-events:none;transform:translate(-50%,-60%) scale(1.1);opacity:.95;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.benchbox{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface)}
.brow{display:flex;justify-content:space-around}
.benchbox .slot{color:var(--fg)}
.lowrow{display:flex;gap:12px;align-items:stretch;margin-top:12px}
.lowl{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px}
.coachbox{border:1px solid var(--line);border-radius:12px;padding:8px 10px 6px;display:flex;flex-direction:column;align-items:center;background:var(--surface);gap:4px}
.coachbox small{font-weight:700;color:var(--muted)}
.coachbox .slot{color:var(--fg)}
.rpos{position:absolute;left:3px;top:3px;font:800 9px/1 var(--font-body);color:#fff;padding:2px 4px;border-radius:4px;letter-spacing:.04em;box-shadow:0 1px 2px rgba(0,0,0,.4)}.rpos.pt{left:auto;top:auto;right:3px;bottom:3px}.tile.hrv .mv,.tile.hrv .capb{bottom:17px}
.rpos.POR{background:var(--p-por)}.rpos.DEF{background:var(--p-def)}.rpos.MED{background:var(--p-med)}.rpos.DEL{background:var(--p-del)}.rpos.ENT{background:#5b6475}
.mv{position:absolute;left:3px;bottom:3px;background:var(--hot);color:var(--hot-ink);font:700 9.5px/1 var(--font-body);padding:3px 4px;border-radius:4px;letter-spacing:.04em}
@media (min-width:520px){body{background:var(--bg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function applyFormation(f){
  var c=FORM[f],need={POR:1,DEF:c[0],MED:c[1],DEL:c[2]},used={},next={};
  POS.forEach(function(p){next[p]=S.lineup[p].filter(function(x){return x!=null}).slice(0,need[p]);next[p].forEach(function(x){used[x]=1})});
  POS.forEach(function(p){
    var pool=S.squad.filter(function(id){return P[id].p===p&&!used[id]}).sort(function(a,b){return P[b].pts-P[a].pts});
    while(next[p].length<need[p]){var id=pool.shift();next[p].push(id==null?null:id);if(id!=null)used[id]=1}
  });
  S.lineup=next;S.formation=f;S.saved=false;

function dealsView(part){
  var me=S.user.uid,inc=inOffers().sort(function(a,b){return b.ts-a.ts}),out=outDeals().sort(function(a,b){return b.ts-a.ts});

    var id=pidOf(d.a);if(id==null)return '';
    var left=(d.type==='offer'||d.type==='swap'||d.type==='loan')&&d.status==='pending'?' · caduca en '+leftTxt(d.ts+offerTtl()):'';
    var gi=d.type==='swap'?pidOf(d.give):null,gn=gi!=null&&P[gi]?P[gi].n:'un jugador';

    var st=mode==='out'?(d.status==='accepted'?'Aceptada · en trámite':d.type==='clause'?'En trámite':'Esperando respuesta'):'';
    var btns=mode==='in'?'<div style="display:flex;gap:8px;margin-top:10px"><button class="btn primary" style="flex:1" data-a="dealAccept" data-d="'+d.id+'">Aceptar</button><button class="btn" style="flex:1" data-a="dealReject" data-d="'+d.id+'">Rechazar</button></div>'
      :(d.status==='pending'?'<div style="margin-top:10px"><button class="btn sm" data-a="dealCancel" data-d="'+d.id+'">Cancelar</button></div>':'');
    return '<div class="item"><div style="display:flex;gap:12px;align-items:center">'+avatar(id)+'<div style="flex:1;min-width:0"><div class="pname">'+esc(P[id].n)+'</div><div class="psub">'+who+left+(st?' · '+st:'')+'</div></div><b>'+(d.type==='swap'?'⇄':fmt(d.amount))+'</b></div>'+btns+'</div>';
  };
  var HIN='<h3 style="margin:16px 0 8px">Ofertas recibidas'+(inc.length?' · '+inc.length:'')+'</h3>'+(inc.length?'<div class="list">'+inc.map(function(d){return row(d,'in')}).join('')+'</div>':'<p class="muted small" style="margin:0 2px">No tienes ofertas pendientes.</p>')+'';
  var HOUT='<h3 style="margin:16px 0 8px">Tus ofertas y clausulazos</h3>'+(out.length?'<div class="list">'+out.map(function(d){return row(d,'out')}).join('')+'</div>':'<p class="muted small" style="margin:0 2px">No tienes ofertas en curso. Entra en la plantilla de un mánager desde la Clasificación para ofertar o clausular.</p>')+'';
  var NOTE='<p class="small muted" style="margin:12px 2px 0">Las ofertas aceptadas y los clausulazos se ejecutan al momento; si hay un fallo de conexión, el servidor los recoge en unos minutos.</p>';
  return part==='in'?HIN:part==='out'?HOUT+NOTE:HIN+HOUT+NOTE;
}
function opsView(){

      return '<div class="item"><div style="display:flex;gap:12px;align-items:center">'+avatar(l.id)+'<div style="flex:1;min-width:0"><div class="pname">'+esc(P[l.id].n)+'</div><div class="psub">Precio mínimo '+fmt(l.ask)+(bidTxt(l.id)?' · <b class="bcnt">'+bidTxt(l.id)+'</b>':'')+'</div></div><button class="btn sm" data-a="unlist" data-id="'+l.id+'">Retirar</button></div>'+offer+'</div>'}).join('')+'</div>':'<p class="muted small" style="margin:0 2px">No tienes jugadores en venta. Ponlos desde tu plantilla.</p>';

/* ---- Draft ---- */
var DSLOT={POR:2,DEF:5,MED:5,DEL:3,ENT:1},DTOTAL=16;
function draftTabOn(){var D=S.draft;return !!(D&&D.status==='running')||!!(S.dr&&!D)||!!(S.dr&&D&&D.status==='running')}
function draftTurn(D){if(!D||D.status!=='running'||!D.order||!D.order.length)return null;var n=D.order.length,r=Math.floor(D.pick/n),i=D.pick%n;return D.order[r%2?n-1-i:i]}
function draftTotal(D){return D.order.length*DTOTAL}
function draftTaken(){var o=ownedApi();((S.draft&&S.draft.picks)||[]).forEach(function(x){o[x.a]=1});return o}
function draftCounts(uid){var c={POR:0,DEF:0,MED:0,DEL:0,ENT:0};admSquad(uid).forEach(function(a){var i=pidOf(a);if(i!=null&&P[i])c[P[i].p]++});return c}
function draftRandom(uid,taken,c){c=c||draftCounts(uid);var ok=P.filter(function(p){return !taken[p.a]&&c[p.p]<DSLOT[p.p]});return ok.length?ok[Math.floor(Math.random()*ok.length)].a:null}
function draftView(){
  var D=S.draft,me=S.user.uid;
  if(!D)return '<div class="panel pad" style="margin-top:12px"><b>El draft todavía no ha empezado.</b><p class="small muted" style="margin:6px 0 0">'+(S.lg.admin?'Cuando estéis todos en la liga, inícialo desde Ajustes → Herramientas del administrador.':'El administrador lo iniciará cuando estéis todos. Empezáis sin jugadores y vais eligiendo por turnos.')+'</p></div>';
  var tn=draftTurn(D),tot=draftTotal(D),mine=tn===me,c=draftCounts(me);
  var slots=['POR','DEF','MED','DEL','ENT'].map(function(q){return '<span class="tag'+(c[q]>=DSLOT[q]?' ok':'')+'">'+lab(q)+' '+c[q]+'/'+DSLOT[q]+'</span>'}).join(' ');
  var head='<div class="panel pad" style="margin-top:12px"><div class="small muted">Pick '+Math.min(D.pick+1,tot)+' de '+tot+'</div><div style="font:700 20px/1.2 var(--font-display);margin:2px 0 8px">'+(mine?'¡Es tu turno!':'Turno de '+esc(admName(tn)))+'</div><div style="display:flex;gap:6px;flex-wrap:wrap">'+slots+'</div></div>';
  var board='';
  if(mine){
    var taken=draftTaken(),pos=S.dpos||'all',q=sn((S.dq||'').trim());
    var chips=['all','POR','DEF','MED','DEL','ENT'].filter(function(x){return x==='all'||c[x]<DSLOT[x]}).map(function(x){return '<button class="chip'+(pos===x?' on':'')+'" data-a="dpos" data-p="'+x+'" aria-pressed="'+(pos===x)+'">'+(x==='all'?'Todos':lab(x))+'</button>'}).join('');
    var list=P.filter(function(p){return !taken[p.a]&&c[p.p]<DSLOT[p.p]&&(pos==='all'||p.p===pos)&&(!q||sn(p.n).indexOf(q)>-1||sn(TEAMN[p.t]||'').indexOf(q)>-1)}).sort(function(a,b){return VAL[b.id]-VAL[a.id]}).slice(0,30);
    board='<div class="jbar" style="margin-top:12px;gap:8px">'+chips+'</div><input class="inp" id="drQ" autocomplete="off" placeholder="Buscar jugador o equipo" value="'+esc(S.dq||'')+'" style="margin-top:10px"><div class="list" style="margin-top:10px" id="drRes">'+(list.length?list.map(function(p){return prow(p.id,'<button class="btn sm primary" data-a="draftPick" data-pl="'+p.a+'">Elegir</button>',' '+'<span class="tag">'+fmt(VAL[p.id])+'</span>','playerS')}).join(''):'<p class="muted small" style="margin:14px">No hay jugadores con ese filtro.</p>')+'</div>';
  }
  var last=(D.picks||[]).slice(-10).reverse().map(function(x,i){var pi=pidOf(x.a);return '<div class="setrow"><div><b>'+(pi!=null&&P[pi]?esc(P[pi].n):'Jugador')+'</b><p>Pick '+((D.picks.length)-i)+' · '+esc(admName(x.u))+'</p></div></div>'}).join('');
  return head+board+'<h3 style="margin:16px 0 8px">Últimos picks</h3><div class="panel">'+(last||'<p class="muted small" style="margin:0;padding:14px">Todavía no se ha elegido a nadie.</p>')+'</div>';
}

    '<p class="small muted" style="margin:8px 2px 0">Pujas a ciegas: gana la más alta al cierre. Los valores suben o bajan según las pujas.'+(REAL&&CLOUD?' Solo salen jugadores libres o que otro mánager ha puesto a la venta.':'')+'</p>'+

    }).join('')+'</div>':'<p class="muted" style="margin-top:16px">No tienes ofertas pendientes.</p>';
  }
  if(S.mtab==='mine'&&!(REAL&&CLOUD)){
    var ids=Object.keys(S.bids);
    body=ids.length?'<div class="list" style="margin-top:12px">'+ids.map(function(k){var id=+k;return '<div class="item" style="display:flex;gap:12px;align-items:center">'+avatar(id)+'<div style="flex:1;min-width:0"><div class="pname">'+esc(P[id].n)+'</div><div class="psub">Valor '+fmt(VAL[id])+'</div></div><div style="text-align:right"><b>'+fmt(S.bids[id])+'</b><br><button class="btn sm" style="margin-top:6px" data-a="withdraw" data-id="'+id+'">Retirar</button></div></div>'}).join('')+'</div>':'<p class="muted" style="margin-top:16px">No has pujado por nadie todavía. Elige un jugador del mercado.</p>';
  }
  if(S.mtab==='hist'&&REAL&&CLOUD)body=histView();
  else if(S.mtab==='hist'){
    body='<div class="list" style="margin-top:12px">'+S.hist.map(function(h){return '<div class="item"><div class="meta"><span>'+esc(h.t)+'</span></div><div>'+esc(h.x)+'</div></div>'}).join('')+'</div>';
  }
  return '<h2>Mercado de fichajes</h2><div style="margin-top:12px">'+seg+'</div>'+body;

function swapPlayers(a,b){
  if(!a||!b||(a.k==='B'&&b.k==='B'))return;
  if(a.k==='B'){var t=a;a=b;b=t}
  var aid=S.lineup[a.pos]?S.lineup[a.pos][a.i]:null;
  if(b.k==='B'){
    var bid=b.id,line=a.pos,nat=P[bid]&&P[bid].p;
    if(!bid||S.squad.indexOf(bid)<0||nat==='ENT')return;
    if(line==='POR'&&nat!=='POR'){toast('En portería solo juega un portero');return}
    if(line!=='POR'&&nat==='POR'){toast('Un portero solo puede jugar de portero');return}
    S.lineup[line][a.i]=bid;setRole(bid,line);
    if(aid!=null)delete S.role[aid];
    S.saved=false;toast(short(P[bid].n)+' entra'+(aid!=null?' por '+short(P[aid].n):''));render();return;
  }
  var bid2=S.lineup[b.pos]?S.lineup[b.pos][b.i]:null;
  if(aid==null)return;
  if(bid2==null){
    if(a.pos!==b.pos){toast('Para mover jugadores entre líneas cambia la formación');return}
    var arr=S.lineup[a.pos];arr[b.i]=aid;arr[a.i]=null;S.saved=false;render();return;
  }
  if((a.pos==='POR')!==(b.pos==='POR')){toast('Los porteros no cambian de línea');return}
  S.lineup[a.pos][a.i]=bid2;S.lineup[b.pos][b.i]=aid;
  setRole(aid,b.pos);setRole(bid2,a.pos);
  S.saved=false;
  toast(a.pos===b.pos?'Jugadores intercambiados':short(P[aid].n)+' juega de '+POSN[b.pos].toLowerCase()+' y '+short(P[bid2].n)+' de '+POSN[a.pos].toLowerCase());
  render();
}

function setPhoto(file){
  if(!file)return;
  var fr=new FileReader();
  fr.onload=function(){var im=new Image();
    im.onload=function(){
      var c=document.createElement('canvas');c.width=c.height=160;var cx=c.getContext('2d'),m=Math.min(im.width,im.height);
      cx.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);
      var u=c.toDataURL('image/jpeg',0.8);
      if(!u||u.length>60000){toast('La foto es demasiado grande');return}
      S.ph=u;try{localStorage.setItem('helios.ph.'+S.user.uid,u)}catch(x){}
      queueSave();render();toast('Foto guardada');
    };
    im.onerror=function(){toast('No se pudo leer esa imagen')};
    im.src=fr.result;
  };
  fr.onerror=function(){toast('No se pudo leer esa imagen')};
  fr.readAsDataURL(file);
}

function dRm(x,a){
  x.squad=(x.squad||[]).filter(function(y){return String(y)!==String(a)});

function admRun(jobs,opts){

function render(){
  var nav=$('.nav'),bal=$('#bal');
  if(CLOUD&&!S.authReady){bal.innerHTML='';nav.hidden=true;$('#view').innerHTML='<p class="muted" style="margin-top:24px">Conectando con Firebase…</p>';return}
  if(CLOUD&&!S.user){bal.innerHTML='';nav.hidden=true;$('#brandSub').textContent='Fantasy · DWT';$('#view').innerHTML=viewAuth();return}
  if(CLOUD&&!REAL){bal.innerHTML='';nav.hidden=true;$('#brandSub').textContent='Fantasy · DWT';$('#view').innerHTML=viewCat();return}
  if(CLOUD&&!S.lg.id&&S.tab!=='leagues')S.tab='leagues';
  nav.hidden=!!(CLOUD&&!S.lg.id);
  if(CLOUD&&loadingLeague){bal.innerHTML='';$('#brandSub').textContent=S.lg.name;$('#view').innerHTML='<p class="muted" style="margin-top:24px">Cargando liga…</p>';return}
  renderMain();
  if(CLOUD&&!S.lg.id)bal.innerHTML='';
  queueSave();
}
function renderMain(){
  var b=$('#bal');b.className='bal'+(S.cash<0?' neg':'');var pb=pendingBids();b.innerHTML='<small>Saldo</small><b>'+fmt(S.cash)+'</b>'+(pb>0?'<span class="balx pend">\u2212'+fmt(pb)+'</span><span class="balx'+(availCash()<0?' neg':'')+'">'+fmt(availCash())+'</span>':'');
  var views={home:viewHome,market:viewMarket,team:viewTeam,liga:viewLiga,set:viewSet,leagues:viewLeagues};
  $('#brandSub').textContent=S.lg.name;
  cleanRoles();
  $('#view').innerHTML=(S.vm&&S.tab==='liga'&&REAL)?viewRival():views[S.tab]();
  document.querySelectorAll('.nav button').forEach(function(x){x.setAttribute('aria-current',x.dataset.tab===S.tab?'page':'false')});
  var mb=$('#menuB');if(mb)mb.hidden=!(S.lg.id||!CLOUD);
  var d=$('#offDot'),oc=offerCount();d.hidden=!oc;d.textContent=oc;
  tick();
}

/* hojas */
function moveCheck(pos,to){
  if(pos==='POR'||to==='POR')return {ok:false,why:'Los porteros no cambian de línea.'};
  if(S.lineup[pos].length-1<MINL[pos])return {ok:false,why:'Necesitas al menos '+MINL[pos]+' '+PLUR[pos]+' en el campo.'};
  if(S.lineup[to].length+1>MAXL[to])return {ok:false,why:'Solo caben '+MAXL[to]+' '+PLUR[to]+' como máximo.'};
  var c={DEF:S.lineup.DEF.length,MED:S.lineup.MED.length,DEL:S.lineup.DEL.length};c[pos]--;c[to]++;
  return {ok:true,label:c.DEF+'-'+c.MED+'-'+c.DEL};
}
function sheetMove(pos,i){
  var id=S.lineup[pos][i];if(id==null)return;
  var p=P[id],k=ORDER.indexOf(pos);
  if(pos==='POR'){openSheet('<h2>'+esc(p.n)+'</h2><p class="muted small" style="margin:4px 0 0">Un portero no puede jugar en el campo.</p><button class="btn full" data-a="close">Cerrar</button>');return}
  function row(to,txt,why,prim){
    var c=why?{ok:false,why:why}:moveCheck(pos,to);
    return c.ok?'<button class="btn'+(prim?' primary':'')+' full" data-a="doMove" data-pos="'+pos+'" data-i="'+i+'" data-to="'+to+'">'+txt+' <small>(formación '+c.label+')</small></button>':'<button class="btn full" disabled>'+txt+'</button><p class="small muted" style="margin:6px 2px 0">'+c.why+'</p>';
  }
  var up=ORDER[k+1],down=ORDER[k-1];
  var rows=(up?row(up,'Subir a '+POSN[up],null,true):row(null,'Subir de línea','Ya juega en la línea más adelantada.'))+
    (down&&down!=='POR'?row(down,'Bajar a '+POSN[down],null,true):row(null,'Bajar de línea','No puede jugar de portero.'))+
    (pos!==p.p?row(p.p,'Volver a '+POSN[p.p].toLowerCase(),null,false):'');

function callDeals(){
  // ejecuta al instante en el servidor; si falla, el proceso programado lo recoge en unos minutos
  try{
    if(!FB||!FB.app||!FB.app().functions)return;
    var fn=FB.app().functions('europe-west1').httpsCallable('runDeals');
    fn({lid:S.lg.id}).then(function(res){
      var r=(res&&res.data)||{},bad=null;
      Object.keys(r.resolved||{}).forEach(function(k){if(r.resolved[k].status==='failed')bad=r.resolved[k].note});
      if(bad)toast('No se pudo completar: '+bad);
      else if(r.done>0)toast('Traspaso completado');
    }).catch(function(){});
  }catch(x){}
}
function sendDeal(type,id,amount,extra){
  var m=ownerRv(id);
  if(!m||!m.uid){toast('Ese jugador ya no es de ningún mánager');return}
  var dup=myDeals().some(function(d){return d.buyer===S.user.uid&&String(d.a)===String(P[id].a)});
  if(dup){toast('Ya tienes un trato pendiente por este jugador');return}
  var ref=db.collection('leagues').doc(S.lg.id).collection('deals').doc();
  ref.set(Object.assign({type:type,buyer:S.user.uid,buyerName:S.user.name,seller:m.uid,sellerName:m.n,a:P[id].a,amount:r2(amount),status:'pending',ts:Date.now()},extra||{})).then(function(){
    closeSheet();
    toast(type==='clause'?'Clausulazo enviado…':(type==='swap'?'Intercambio propuesto a ':type==='loan'?'Cesión pedida a ':'Oferta enviada a ')+m.n+'. Caduca en '+Math.round(offerTtl()/86400000)+' días.');

  }).catch(function(e){toast('No se pudo enviar: '+fbErr(e))});

/* mercado: cierre simulado con la regla de precios */
function resolveMarket(){
  var out=[],keep=[];
  S.listings.forEach(function(l){
    var id=l.id,v=VAL[id],mine=S.bids[id],name=P[id].n;
    if(l.seller==='Tú'){
      if(Math.random()<.7){var pr=+(l.ask*(1+Math.random()*.12)).toFixed(2),by=RIVALS[Math.floor(Math.random()*RIVALS.length)];removeFromSquad(id);S.cash=+(S.cash+pr).toFixed(2);log('Vendes a '+name+' a '+by+' por '+fmt(pr)+'.');news('fichaje',by+' ficha a '+name+' de tu plantilla por '+fmt(pr)+'.');out.push('Vendiste a '+name)}
      else keep.push(l);
      return;
    }
    if(l.seller!=='Ordenador'){
      if(mine!=null&&mine>=l.ask&&S.cash>=mine){S.cash=+(S.cash-mine).toFixed(2);S.squad.push(id);log('Compras a '+name+' a '+l.seller+' por '+fmt(mine)+'.');news('fichaje','Fichas a '+name+' de '+l.seller+' por '+fmt(mine)+'.');out.push('Fichaste a '+name);}
      else news('fichaje',RIVALS[1]+' ficha a '+name+' de '+l.seller+' por '+fmt(l.ask*1.02)+'.');
      return;
    }
    var bids=[],n=Math.random()>.2?1+Math.floor(Math.random()*3):0;
    for(var k=0;k<n;k++)bids.push({who:RIVALS[Math.floor(Math.random()*RIVALS.length)],a:+(v*(1+Math.random()*.3)).toFixed(2)});
    if(mine!=null&&mine>=v)bids.push({who:'Tú',a:mine});
    if(!bids.length){VAL[id]=Math.max(.16,+(v*.97).toFixed(2));HIST[id].push(VAL[id]);HIST[id].shift();return}
    bids.sort(function(a,b){return b.a-a.a});
    var w=bids[0],rise=bids.reduce(function(s,b){return s+(b.a-v)*.1},0);
    rise=Math.min(rise,Math.max(.25,v*.15));
    VAL[id]=+(v+rise).toFixed(2);HIST[id].push(VAL[id]);HIST[id].shift();
    if(w.who==='Tú'){
      if(S.cash>=w.a){S.cash=+(S.cash-w.a).toFixed(2);S.squad.push(id);S.saved=false;log('Compras a '+name+' al ordenador por '+fmt(w.a)+'.');news('fichaje','Fichas a '+name+' por '+fmt(w.a)+'.');out.push('Fichaste a '+name)}
      else news('mercado','Tu puja por '+name+' se anuló por falta de saldo.');
    }else{
      if(mine!=null)news('mercado','Perdiste la puja por '+name+': '+w.who+' pagó '+fmt(w.a)+'.');
      else news('fichaje',w.who+' ficha a '+name+' por '+fmt(w.a)+'.');
    }
  });
  S.bids={};
  S.listings=keep;
  var pool=P.map(function(p){return p.id}).filter(function(id){return S.squad.indexOf(id)<0&&RIVAL_OWNED.indexOf(id)<0&&!S.listings.some(function(l){return l.id===id})});
  while(S.listings.length<S.rules.perDay&&pool.length){var j=Math.floor(Math.random()*pool.length);S.listings.push({id:pool.splice(j,1)[0],seller:'Ordenador'})}
  S.mktEnd=Date.now()+24*3600*1000;
  toast(out.length?out.join(' · '):'Mercado cerrado. Ya hay jugadores nuevos.');
  render();
}

    var subs=['deals','news','rounds'],used=[];
    Promise.all([col.get()].concat(subs.map(function(c){return lref.collection(c).get().catch(function(){return {forEach:function(){}}})}))).then(function(rs){
      var ops=[],mem=rs[0];
      mem.forEach(function(m){
        var old=m.data();SEED_EX=used.slice();
        var np=genMember(R.budget,R.src,{admin:false,name:'',code:''});
        np.uid=m.id;np.name=old.name||'Mánager';np.ph=old.ph||'';np.rev=(old.rev||0)+1;
        used=used.concat(np.squad||[]);
        ops.push(function(b){b.set(col.doc(m.id),np)});

  if(e.target&&e.target.id==='drQ'){S.dq=e.target.value;var dr=$('#drRes');render();var di=$('#drQ');if(di&&di.focus){di.focus();try{di.setSelectionRange(di.value.length,di.value.length)}catch(x){}}return}
  if(e.target&&e.target.id==='admQ'){S.admQ=e.target.value;var ar=$('#admRes');if(ar)ar.innerHTML=admRows()}
  if(e.target&&e.target.id==='srchIn'){S.q=e.target.value;var r=$('#srchRes');if(r)r.innerHTML=searchRows()}
});
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='phIn'){var fl=e.target.files&&e.target.files[0];setPhoto(fl);return}
  var k=e.target.dataset&&e.target.dataset.change;if(!k)return;
  if(!S.lg.admin){toast('Solo el administrador puede cambiar las reglas');render();return}
  if(k==='bonus')S.rules.bonus=parseFloat(e.target.value);
  if(k==='ideal')S.rules.ideal=parseFloat(e.target.value)||0;
  if(k==='clubMax'||k==='offerDays'||k==='lockDays'||k==='clauseMult')S.rules[k]=parseFloat(e.target.value)||0;
  if(k==='admMgr'){S.admMgr=e.target.value;render();return}
  if(k==='budget'){var bv=parseM(e.target.value);if(!(bv>0)){toast('Escribe un número mayor que 0, por ejemplo 250');render();return}S.rules.budget=bv;toast('Presupuesto inicial: '+fmt(bv))}
  if(k==='src')S.rules.src=e.target.value;
  if(k==='debt')S.rules.debt=parseInt(e.target.value,10)||0;
  rulesChanged();
  render();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeSheet();
  if(e.key==='Enter'&&e.target.id==='msgIn')A.post();
  if(e.key==='Enter'&&CLOUD&&(e.target.id==='auMail'||e.target.id==='auPass'||e.target.id==='auName'))A.doAuth();
});
var THEME='dark';
try{var tv=localStorage.getItem('helios.theme');if(tv==='light'||tv==='dark')THEME=tv}catch(e){}
function applyTheme(){
  if(document.documentElement)document.documentElement.setAttribute('data-theme',THEME);
  var tb=$('#themeB');
  if(tb)tb.innerHTML=THEME==='dark'?'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  if(tb&&tb.setAttribute)tb.setAttribute('title',THEME==='dark'?'Pasar a modo claro':'Pasar a modo oscuro');
  var mt=$('meta[name="theme-color"]');if(mt&&mt.setAttribute)mt.setAttribute('content',THEME==='dark'?'#0C1630':'#0F1E3D');
}
A.theme=function(){THEME=THEME==='dark'?'light':'dark';try{localStorage.setItem('helios.theme',THEME)}catch(e){}applyTheme()};
applyTheme();
setInterval(tick,1000);
render();
if(CLOUD)startAuth();
})();
</script>
</body>
</html>
